<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mankala - Gra online</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Mankala (Kalaha)</h1>
        <div id="nick-section" class="nick-form">
            <input type="text" id="nick-input" placeholder="Twój nick" maxlength="20">
            <button id="join-btn">Dołącz do gry</button>
        </div>
        <div id="game-area" style="display: none;">
            <div id="game-status" class="status"></div>
            <div class="board-container">
                <div class="board" id="board"></div>
            </div>
        </div>
        <div class="scoreboard">
            <h2>Tabela wyników</h2>
            <ul id="scores-list"></ul>
            <button id="refresh-scores">Odśwież</button>
        </div>
    </div>
    <script src="/js/ScoreAPI.js"></script>
    <script src="/js/WebSocketManager.js"></script>
    <script src="/js/UIRenderer.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
