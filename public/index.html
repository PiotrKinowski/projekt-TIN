<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mancala - Gra online</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Mancala (Kalaha)</h1>
        <div id="game-status" class="status">Łączenie z serwerem...</div>
        <div class="board-container">
            <div class="board" id="board"></div>
        </div>
        <div class="scoreboard">
            <h2>Tabela wyników</h2>
            <ul id="scores-list"></ul>
            <button id="refresh-scores">Odśwież</button>
        </div>
    </div>
    <script src="/js/ScoreAPI.js"></script>
    <script src="/js/WebSocketManager.js"></script>
    <script src="/js/UIRenderer.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
